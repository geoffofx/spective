<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spective!</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2 style="margin:0 0 10px 0; text-align:center;">Log In</h2>
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-pass" placeholder="Password">
        <button id="btn-login">Sign In</button>
        <p id="login-error" style="color:red; font-size:12px; text-align:center; display:none;"></p>
    </div>
</div>

<header id="app-header">
    <h1>spective</h1>
</header>
    
<div class="calendar-container" id="calendar"></div>

<div class="nav-pill">
    <button id="nav-past" title="Load Past 4 Weeks">↑ Past</button>
    <div class="nav-divider"></div>
    <button id="nav-today" title="Jump to Today">★ Today</button>
    <div class="nav-divider"></div>
    <button id="nav-refresh" title="Refresh App">↻ Refresh</button>
</div>
    
<dialog id="summary-modal">
    <h3 id="modal-week-label">Week of</h3>
    <textarea id="summary-input" placeholder="Enter life events for this week..."></textarea>
    <div class="modal-actions">
        <button id="btn-cancel">Cancel</button>
        <button id="btn-save">Save</button>
    </div>
</dialog>

<script type="module" src="./app.js"></script>
</body>
</html>
